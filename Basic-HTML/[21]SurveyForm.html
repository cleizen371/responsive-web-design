<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Cleizen Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
    <form id="survey-form">
      <label id="name-label">Name</label>
      <input required id="name" type="text" placeholder="Enter your name">
      <label id="email-label">Email</label>
      <input required id="email" type="email" placeholder="Enter your email">
      <label id="number-label">Age(optional)</label>
      <input id="number"type="number" min="3" max="100" placeholder="Age">
      <p>Which option best describes your current role?</p>
      <select id="dropdown">
        <option>Student</option>
        <option>Full Time Job</option>
      </select>
      <p>Would you recommend Cleizen to a friend?</p>
      <input id="yes-option" type="radio" name="recommendation">
      <label for="yes-option">Yes</label>
      <input id="no-option" type="radio" name="recommendation">
      <label for="no-option">No</label>

      <p>
        What would you like to see improved? (Check all that apply)
      </p>
      <input id="front-end"type="checkbox" value="front-end">
      <label for="front-end">Front-end</label>

      <input id="theme"type="checkbox" value="theme">
      <label for="theme">theme</label>

      <p>Any comments or suggestions?</p>
      <textarea cols="30" rows="10" name="comments" id="comments"></textarea>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
