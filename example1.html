<!DOCTYPE html>
<html>
  <head lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1</title>
  </head>
  <body>
    <input class="start-btn" type="button" value="Start Game" />
    <script src="index1.js"></script>
    <br><br>
    <form action="">
      <label for="email">Email Address (Required field):</label>
      <input
        required
        type="email"
        name="email"
        id="email"
        minlength="12"
        maxlength="64"
      />
    </form>
    <button type="submit">Submit Form</button>
    <br><br>
    <p>this is a readonly input
    <input
      readonly
      type="email"
      name="email"
      id="email"
      value="example@email.com"
    />
    </p>
    <br><br>
    <table>
      <thead>
        <tr>
          <th>The title of this table</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>First Row</th>
          <td>
            First Data Cell
          </td>
        </tr>
        <tr>
          <th>Second Row</th>
          <td>
            Second Data Cell
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th>The footer of this table, which might contain date of publication, author credits, or other meta information.</th>
        </tr>
      </tfoot>
    </table>
    <table>
  <tbody>
    <tr>
      <td></td>
      <th scope="col">Name</th>
      <th scope="col">Age</th>
    </tr>
    <tr>
      <th rowspan="2" scope="row">Dogs</th>
      <th scope="row">Nora</th>
      <td>5</td>
    </tr>
    <tr>
      <th scope="row">Gino</th>
      <td>2</td>
    </tr>
    <tr>
      <th rowspan="2" scope="row">Cats</th>
      <th scope="row">Lulu</th>
      <td>10</td>
    </tr>
    <tr>
      <th scope="row">Elizabeth</th>
      <td>6</td>
    </tr>
  </tbody>
</table>
  </body>
</html>
